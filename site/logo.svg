<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Blockhound">
  <!-- Blockhound: köşeli bir tazı başı; uzun burnu aşağıdaki zincir bloklarını kokluyor, kulak sarkık -->
  <rect width="64" height="64" rx="14" fill="#111111"/>
  <!-- baş, uzun ve aşağı eğik burun, boyun -->
  <path d="M10 56 L10 33 L15 22 L27 16 L37 19 L44 25 L57 35 L58 41 L52 43 L41 40 L34 44 L28 48 L25 56 Z" fill="#eeeeee"/>
  <!-- sarkık kulak -->
  <path d="M17 22 L28 19 L30 33 L25 44 L19 41 L16 31 Z" fill="#a4a19b"/>
  <!-- göz: bir blok -->
  <rect x="35" y="24" width="4" height="4" fill="#111111"/>
  <!-- burun -->
  <rect x="54" y="37" width="4" height="4" fill="#111111"/>
  <!-- koklanan bloklar: biri dolu, ikisi iz -->
  <rect x="49" y="47" width="9" height="9" rx="1.5" fill="#2b7fff"/>
  <rect x="42" y="51" width="5" height="5" rx="1" fill="#2b7fff" opacity="0.55"/>
  <rect x="37" y="54" width="3" height="3" rx="0.5" fill="#2b7fff" opacity="0.3"/>
</svg>
